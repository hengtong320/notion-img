<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050403"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>四象归真·原生矢量精修版V3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;color:#d8a642}body{display:grid;place-items:center;font-family:"STKaiti","KaiTi",serif}.l{text-align:center;font-size:18px;letter-spacing:3px}.s{display:block;margin-top:12px;color:#846126;font:13px/1.6 sans-serif;letter-spacing:1px}</style></head><body><div class="l">玄金阵图载入中…<span class="s">原生 SVG 矢量绘制 · 首次打开约需数秒</span></div><script>const files=['v3_0.b64','v3_1.b64','v3_2.b64','v3_3.b64','v3_4.b64','v3_5.b64'];Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+':'+r.status);return r.text()}))).then(parts=>{const td=new TextDecoder();const html=parts.map(s=>{const clean=s.replace(/\s+/g,'');const b=atob(clean),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return td.decode(u)}).join('');document.open();document.write(html);document.close()}).catch(err=>{console.error(err);document.body.innerHTML='<div class="l">载入失败，请刷新重试<span class="s">请使用 Safari 或 Chrome 打开</span></div>'})</script></body></html>
