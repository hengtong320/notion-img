<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050403"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>四象归真·原生矢量精修版V3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;color:#d8a642}body{display:grid;place-items:center;font-family:"STKaiti","KaiTi",serif}.l{text-align:center;font-size:18px;letter-spacing:3px}.s{display:block;margin-top:12px;color:#846126;font:13px/1.6 sans-serif;letter-spacing:1px}</style></head><body><div class="l">玄金阵图载入中…<span class="s">原生 SVG 矢量绘制 · 首次打开约需数秒</span></div><script>(async()=>{try{const root='https://raw.githubusercontent.com/hengtong320/notion-img/sixiang-guizhen-h5/sixiang-guizhen/';const files=['g0.b64','g1.b64','g2.b64','g3a.b64','g3b.b64','g4a.b64','g4b.b64'];const parts=await Promise.all(files.map(f=>fetch(root+f+'?v=3',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+':'+r.status);return r.text()})));const s=parts.join('').replace(/\s+/g,'');const raw=atob(s),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(!('DecompressionStream' in window))throw Error('当前浏览器不支持原生解压');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(err){console.error(err);document.body.innerHTML='<div class="l">载入失败，请刷新重试<span class="s">请使用最新版 Safari 或 Chrome 打开</span></div>'}})();</script></body></html>
