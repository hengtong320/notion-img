<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>四象归真·可玩H5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#f7dda0;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;touch-action:none}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#1a140a 0,#080706 48%,#020202 100%)}#wrap{position:relative;width:min(100vw,56.25vh);height:min(177.777vw,100vh);max-width:620px;max-height:1102px;overflow:hidden;box-shadow:0 0 50px #000}canvas{display:block;width:100%;height:100%;background:#050505}#tip{position:absolute;left:50%;bottom:13.1%;transform:translateX(-50%);padding:.55em 1.15em;border:1px solid #a56a1d;border-radius:999px;background:#090806e8;color:#ffe7a4;font:600 clamp(12px,3vw,17px) sans-serif;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none}#tip.show{opacity:1}.modal{position:absolute;inset:0;display:grid;place-items:center;background:#000b;backdrop-filter:blur(3px);padding:7%;z-index:5}.modal.hide{display:none}.card{width:100%;padding:9% 7%;border:2px solid #d9a63a;border-radius:24px;background:linear-gradient(#17110b,#070605);text-align:center;box-shadow:0 0 45px #000}.seal{width:88px;height:88px;margin:auto;display:grid;place-items:center;border:4px double #e2ad40;border-radius:50%;background:#650e0b;color:#ffd66c;font-size:44px;box-shadow:0 0 22px #bd2c18}.card h2{font-size:32px;margin:18px 0 8px}.card p{font:16px/1.7 sans-serif;color:#d7b975}.actions{display:flex;gap:12px;margin-top:24px}.actions button{flex:1;padding:14px 8px;border:1px solid #d9a63a;border-radius:16px;background:#15100a;color:#ffe1a0;font-size:17px}.actions button.primary{background:#78150e;border-color:#ef5737;color:white}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="900" height="1600" aria-label="四象归真箭头消除游戏"></canvas>
<div id="tip"></div>
<div id="modal" class="modal hide"><div class="card"><div id="seal" class="seal">归</div><h2 id="mt">四象归真</h2><p id="mp"></p><div class="actions"><button id="again">重玩本关</button><button id="next" class="primary">下一关</button></div></div></div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),tip=document.getElementById('tip'),modal=document.getElementById('modal');
const W=900,H=1600, GOLD='#e4b64e', GOLD2='#805313', CREAM='#ffe5a0', RED='#e33b2a';
const levels=[{no:135,title:'四象归真',n:42,seed:135},{no:136,title:'五行叠阵',n:54,seed:641},{no:137,title:'北斗归元',n:66,seed:727}];
let li=0,pieces=[],lives=3,moves=0,mistakes=0,start=0,hintLeft=3,clearLeft=3,flash=null,anim=[],busy=false,audio=null;
const board={x:76,y:300,w:748,h:900,cols:20,rows:24};
const obstacles=new Set();for(let y=9;y<=14;y++)for(let x=7;x<=12;x++)obstacles.add(x+','+y);
const rng=s=>()=>((s=Math.imul(48271,s)%2147483647)&2147483647)/2147483647;
const vec=d=>d==='R'?[1,0]:d==='L'?[-1,0]:d==='D'?[0,1]:[0,-1];
const key=(x,y)=>x+','+y;
function cellxy(x,y){return [board.x+(x+.5)*board.w/board.cols,board.y+(y+.5)*board.h/board.rows]}
function occ(except=-1){let m=new Map;for(const p of pieces)if(p.active&&p.id!==except)for(const c of p.cells)m.set(key(c[0],c[1]),p);return m}
function canExit(p,existing=occ(p.id)){const [dx,dy]=vec(p.dir),own=new Set(p.cells.map(c=>key(...c)));for(const [sx,sy] of p.cells){let x=sx+dx,y=sy+dy;while(x>=0&&y>=0&&x<board.cols&&y<board.rows){let k=key(x,y);if(!own.has(k)){if(obstacles.has(k))return false;if(existing.has(k))return false}x+=dx;y+=dy}}return true}
function pathCells(r){const dirs=[[1,0],[-1,0],[0,1],[0,-1]],turns=r()<.48?0:r()<.85?1:2;let x=1+Math.floor(r()*(board.cols-2)),y=1+Math.floor(r()*(board.rows-2)),di=Math.floor(r()*4),out=[[x,y]],steps=2+Math.floor(r()*4);for(let t=0;t<=turns;t++){for(let i=0;i<steps;i++){let nx=x+dirs[di][0],ny=y+dirs[di][1];if(nx<0||ny<0||nx>=board.cols||ny>=board.rows||obstacles.has(key(nx,ny)))break;x=nx;y=ny;out.push([x,y])}di=(di+(r()<.5?1:3))%4;steps=2+Math.floor(r()*4)}let seen=new Set,out2=[];for(const c of out){let k=key(...c);if(!seen.has(k)){seen.add(k);out2.push(c)}}return out2.length>=2?out2:null}
function gen(level){pieces=[];let r=rng(level.seed),occupied=new Set,tries=0;while(pieces.length<level.n&&tries++<80000){const dir=['R','L','U','D'][Math.floor(r()*4)],cells=pathCells(r);if(!cells||cells.some(c=>occupied.has(key(...c))||obstacles.has(key(...c))))continue;let p={id:pieces.length,dir,cells,active:true,hint:0};let map=new Map;for(const q of pieces)if(q.active)for(const c of q.cells)map.set(key(...c),q);if(!canExit(p,map))continue;pieces.push(p);for(const c of cells)occupied.add(key(...c))}while(pieces.length<level.n){let id=pieces.length,row=id%board.rows,dir=id%2?'R':'L',x=dir==='R'?0:board.cols-1,cells=[[x,row]];if(!occupied.has(key(x,row))&&!obstacles.has(key(x,row))){pieces.push({id,dir,cells,active:true,hint:0});occupied.add(key(x,row))}}}
function reset(){let l=levels[li];lives=3;moves=0;mistakes=0;hintLeft=3;clearLeft=3;start=performance.now();flash=null;anim=[];busy=false;gen(l);modal.classList.add('hide');toast('点击纹线，按箭头方向抽离');draw()}
function valid(){return pieces.filter(p=>p.active&&canExit(p))}
function toast(s){tip.textContent=s;tip.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>tip.classList.remove('show'),1200)}
function beep(ok=true){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=ok?560:125;o.type=ok?'sine':'square';g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.17)}catch(e){}}
function clickPiece(p){if(busy||!p.active)return;if(!canExit(p)){mistakes++;lives--;flash={p,t:performance.now()};beep(false);navigator.vibrate?.([35,25,35]);toast('前方被其他纹线挡住');if(lives<=0)setTimeout(fail,350);return}remove(p)}
function remove(p){busy=true;moves++;let [dx,dy]=vec(p.dir);anim.push({p,dx,dy,t:performance.now(),dur:260});beep(true);navigator.vibrate?.(15)}
function finishAnim(a){a.p.active=false;anim=anim.filter(x=>x!==a);busy=false;if(!pieces.some(p=>p.active))win()}
function hint(){if(!hintLeft)return toast('提示已用完');let v=valid();if(!v.length)return toast('暂无可行纹线');hintLeft--;v[Math.floor(Math.random()*v.length)].hint=performance.now()+2200;toast('发光纹线可以抽离')}
function clearOne(){if(!clearLeft)return toast('清除已用完');let v=valid();if(!v.length)return;clearLeft--;remove(v[Math.floor(Math.random()*v.length)])}
function fail(){document.getElementById('seal').textContent='困';document.getElementById('mt').textContent='阵心受损';document.getElementById('mp').textContent='三次误判，重新布阵再试一次';document.getElementById('next').textContent='恢复一心';document.getElementById('next').onclick=()=>{lives=1;modal.classList.add('hide');draw()};modal.classList.remove('hide')}
function win(){let sec=Math.max(1,Math.round((performance.now()-start)/1000));document.getElementById('seal').textContent='归';document.getElementById('mt').textContent=levels[li].title+'·完成';document.getElementById('mp').textContent=`用时 ${Math.floor(sec/60)}分${sec%60}秒　步数 ${moves}　误判 ${mistakes}`;document.getElementById('next').textContent='下一关';document.getElementById('next').onclick=()=>{li=(li+1)%levels.length;reset()};modal.classList.remove('hide');beep(true)}
document.getElementById('again').onclick=reset;
function rounded(x,y,w,h,r,fill,stroke=GOLD,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
function text(t,x,y,size=30,color=CREAM,align='center',font='serif'){ctx.fillStyle=color;ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function circle(x,y,r,fill,stroke=GOLD,lw=3){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
function arrowHead(x,y,dir,s=8){let a=dir==='R'?0:dir==='D'?Math.PI/2:dir==='L'?Math.PI:-Math.PI/2;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*s,y+Math.sin(a)*s);ctx.lineTo(x+Math.cos(a+2.55)*s,y+Math.sin(a+2.55)*s);ctx.lineTo(x+Math.cos(a-2.55)*s,y+Math.sin(a-2.55)*s);ctx.closePath();ctx.fillStyle=GOLD;ctx.fill()}
function drawPiece(p,now){if(!p.active)return;let a=anim.find(x=>x.p===p),tx=0,ty=0,alpha=1;if(a){let q=Math.min(1,(now-a.t)/a.dur),e=q*q;tx=a.dx*900*e;ty=a.dy*900*e;alpha=1-q;if(q>=1){finishAnim(a);return}}let pts=p.cells.map(c=>cellxy(...c));ctx.save();ctx.translate(tx,ty);ctx.globalAlpha=alpha;let bad=flash&&flash.p===p&&now-flash.t<600,hi=p.hint>now;ctx.strokeStyle=bad?RED:hi?'#fff1a6':GOLD;ctx.shadowColor=bad?RED:GOLD;ctx.shadowBlur=hi?18:bad?14:5;ctx.lineWidth=bad?7:5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));ctx.stroke();let [dx,dy]=vec(p.dir),lead=pts.reduce((b,q)=>!b||q[0]*dx+q[1]*dy>b[0]*dx+b[1]*dy?q:b,null);arrowHead(lead[0]+dx*6,lead[1]+dy*6,p.dir,10);ctx.restore()}
function taiji(x,y,r){circle(x,y,r,'#090807',GOLD,5);ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/2);ctx.beginPath();ctx.arc(0,0,r-8,0,Math.PI);ctx.arc(0,-(r-8)/2,(r-8)/2,Math.PI,0,true);ctx.arc(0,(r-8)/2,(r-8)/2,Math.PI,0,false);ctx.closePath();ctx.fillStyle=GOLD;ctx.fill();circle(0,-(r-8)/2,5,'#080706','#080706',1);circle(0,(r-8)/2,5,GOLD,GOLD,1);ctx.restore()}
function beast(x,y,label){circle(x,y,55,'#090807',GOLD,4);text(label,x,y,26,RED)}
function draw(now=performance.now()){ctx.clearRect(0,0,W,H);let g=ctx.createRadialGradient(450,700,20,450,700,900);g.addColorStop(0,'#17120a');g.addColorStop(.55,'#070605');g.addColorStop(1,'#020202');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.07;ctx.strokeStyle=GOLD2;ctx.lineWidth=1;for(let y=0;y<H;y+=24)for(let x=0;x<W;x+=24){ctx.beginPath();ctx.arc(x,y,12,0,Math.PI);ctx.stroke()}ctx.globalAlpha=1;rounded(15,15,W-30,H-30,22,null,GOLD2,2);circle(65,65,38,'#080706');text('‹',65,62,58);circle(150,65,38,'#080706');text('↻',150,64,42);let l=levels[li];text('关卡'+l.no,450,50,38);text(l.title,450,96,30,GOLD);for(let i=0;i<3;i++)text('♥',735+i*52,63,42,i<lives?RED:'#49221d');ctx.strokeStyle=GOLD2;ctx.beginPath();ctx.moveTo(25,140);ctx.lineTo(875,140);ctx.stroke();rounded(board.x-15,board.y-15,board.w+30,board.h+30,12,'#080706aa',GOLD2,3);ctx.strokeStyle='#5a3a10';ctx.lineWidth=1;for(let x=1;x<board.cols;x++){let px=board.x+x*board.w/board.cols;ctx.beginPath();ctx.moveTo(px,board.y);ctx.lineTo(px,board.y+board.h);ctx.stroke()}for(let y=1;y<board.rows;y++){let py=board.y+y*board.h/board.rows;ctx.beginPath();ctx.moveTo(board.x,py);ctx.lineTo(board.x+board.w,py);ctx.stroke()}beast(275,560,'青龙');beast(625,560,'白虎');beast(275,970,'朱雀');beast(625,970,'玄武');taiji(450,750,78);text(pieces.filter(p=>p.active).length,450,845,22,GOLD);for(const p of pieces)drawPiece(p,now);text('箭头方向无阻挡时，整条纹线飞出',450,1265,22,GOLD);const buttons=[{x:180,label:'提示',sub:hintLeft,icon:'灯'},{x:450,label:'重置',sub:'',icon:'↻'},{x:720,label:'清除',sub:clearLeft,icon:'扫'}];for(const b of buttons){circle(b.x,1390,58,'#090807',GOLD,3);text(b.icon,b.x,1387,32);text(b.label,b.x,1472,24,GOLD);if(b.sub!==''){circle(b.x+44,1348,20,'#7a1510',GOLD,2);text(String(b.sub),b.x+44,1348,18,'#fff')}}if(anim.length||pieces.some(p=>p.hint>now)||(flash&&now-flash.t<600))requestAnimationFrame(draw)}
function hit(px,py){let best=null,bd=18;for(const p of pieces)if(p.active){let pts=p.cells.map(c=>cellxy(...c));for(let i=0;i<pts.length-1;i++){let [x1,y1]=pts[i],[x2,y2]=pts[i+1],dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1))),x=x1+t*dx,y=y1+t*dy,d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=p}}}return best}
cv.addEventListener('pointerdown',e=>{e.preventDefault();let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(y<115&&x<210){reset();return}if(y>1320){if(x<300)hint();else if(x<600)reset();else clearOne();draw();return}let p=hit(x,y);if(p)clickPiece(p);draw()},{passive:false});cv.addEventListener('dblclick',e=>e.preventDefault());reset();
})();
</script>
</body>
</html>
